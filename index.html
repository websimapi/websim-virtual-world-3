<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual World</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.157.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="app">
        <div id="game-container">
            <div id="loading-screen">
                <div class="loading-content">
                    <h1>Virtual World</h1>
                    <div class="loader"></div>
                    <p>Loading your experience...</p>
                </div>
            </div>
            <canvas id="game-canvas"></canvas>
            <div id="ui-layer"></div>
            <div id="controls-hint">
                <p>WASD to move | SPACE to jump | SHIFT to run | E to interact</p>
                <p>CLICK + DRAG to look around | B to build | TAB for menu</p>
            </div>
        </div>
    </div>

    <script type="module" src="config.js"></script>
    <script type="module" src="world.js"></script>
    <script type="module" src="avatar.js"></script>
    <script type="module" src="ui.js"></script>
    <script type="module" src="building.js"></script>
    <script type="module" src="app.js"></script>
